name: Discover Odyssey Showtimes

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: discover-odyssey-showtimes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover newly-published showtimes
        run: python -m odyssey_watch.discover

      - name: Commit discovered showtimes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state/discovered_showtimes.json; then
            git add state/discovered_showtimes.json
            git commit -m "Update discovered showtimes"
            for i in 1 2 3; do
              git push && break
              echo "push rejected (concurrent run?), rebasing and retrying ($i)..."
              git pull --rebase origin main
            done
          else
            echo "No new showtimes to commit"
          fi
