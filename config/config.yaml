# Odyssey seat watcher configuration.
# Nothing in this file is secret - it's safe to commit and edit directly.

theater:
  id: 207
  name: "Cinemark Dallas XD and IMAX"
  timezone: "America/Chicago"
  # The path segment of this theater's own page, i.e. the part after
  # cinemark.com/theatres/ - visit https://www.cinemark.com/theatres and
  # find your theater to get this.
  detail_path: "tx-dallas/cinemark-dallas-xd-and-imax"

movie:
  id: 104867
  name: "The Odyssey (IMAX 70mm)"

# How far ahead discover.py looks for newly-published showtimes, in days.
# Cinemark opens tickets on a rolling ~26-day window, so this only needs a
# little headroom beyond that.
discovery:
  lookahead_days: 32

# Showtimes to watch, in addition to whatever discover.py finds
# automatically (see state/discovered_showtimes.json). Normally left
# empty - only use this to pin a specific showtime discover.py hasn't
# picked up yet, or to track a different movie/theater by hand. Same
# format as the entries discover.py writes: id = Cinemark's ShowtimeId,
# datetime = the local-time "Showtime" value with no UTC offset.
showtimes: []

# "Prime middle" seats: the block of rows and seat numbers worth a
# notification. Row letters and seat numbers match what's printed on
# Cinemark's seat map. This theater (207) has rows A-D up front (skip -
# too close) and E-K as the main stadium-seating block; any seat in row E
# or further back is considered good regardless of left/right position.
prime_seats:
  rows: ["E", "F", "G", "H", "J", "K"]
  seat_number_range: [1, 26]

# Only notify about showtimes whose start time falls inside one of these
# local-time windows (theater timezone, 24-hour "HH:MM" clock). An empty
# list means "never notify for showtimes on this day."
#
# Windows are centered on specific showtimes (+/- 20 min) rather than
# left wide open, since only some times of day are actually attendable:
#   Friday: the 3:15pm or 7:00pm show
#   Saturday/Sunday: the 11:30am, 3:15pm, or 7:00pm show
#   Monday-Thursday: not currently free for any showtime
availability_windows:
  monday: []
  tuesday: []
  wednesday: []
  thursday: []
  friday: [["14:55", "15:35"], ["18:40", "19:20"]]
  saturday: [["11:10", "11:50"], ["14:55", "15:35"], ["18:40", "19:20"]]
  sunday: [["11:10", "11:50"], ["14:55", "15:35"], ["18:40", "19:20"]]
